<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs Search</title>
<link rel="stylesheet" href="styles.css">
<script>
  // The saved theme before the first paint, so a dark page does not flash light (app.js does the rest).
  try { const t = localStorage.getItem("rag.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main>
  <header class="top">
    <h1>Docs Search <span>· R&amp;D Products Documentation</span></h1>
    <div class="tools">
      <button type="button" id="clear" class="icon-btn" title="Clear search" aria-label="Clear search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>
        </svg>
      </button>
      <button type="button" id="debug" class="icon-btn" title="Debug: show how each result was scored" aria-label="Debug mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
        </svg>
      </button>
      <button type="button" id="theme" class="icon-btn" title="Switch theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Searches"></nav>
  <form id="form">
    <input id="q" type="search" maxlength="500" placeholder="Ask about connectors, Direct Print, labels…  (press / to focus)" autocomplete="off" autofocus>
    <button type="submit" id="submit">Find</button>
    <div class="filters">
      <label title="Search only the pages of one product (a top-level section of the documentation).">Product <select id="product"><option value="">All</option></select></label>
      <label title="How fragments are found:&#10;Hybrid: by meaning and by exact words together (default, best overall).&#10;Semantic: by meaning only; finds paraphrases.&#10;Keyword: exact words only (BM25); good for error codes, module and setting names.">Mode
        <select id="mode">
          <option value="hybrid">Hybrid</option>
          <option value="vector">Semantic</option>
          <option value="fts">Keyword</option>
        </select>
      </label>
      <label title="A second model re-reads the top 10 fragments together with the question and re-orders them by relevance (0..1). Pages scoring below 0.1 are collapsed as low relevance and never sent to the LLM. Adds a fraction of a second."><input type="checkbox" id="rerank" checked> Rerank &amp; filter</label>
      <span class="llm-group">
        <label id="llm-label" title="Also write an answer from the top pages with the local LLM (LM Studio), citing them as [n]. Check the answer against the cited sources."><input type="checkbox" id="llm"> Answer with LLM</label>
        <select id="model" aria-label="LLM model" title="The LLM that writes the answer. Default: the model loaded in LM Studio. Models marked (not loaded) are loaded on first use, which takes a while."><option value="">Default</option></select>
        <button type="button" id="refresh-models" class="icon-btn" title="Refresh the model list (which models are loaded in LM Studio)" aria-label="Refresh the model list">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          </svg>
        </button>
      </span>
    </div>
  </form>
  <div id="status"></div>
  <section id="answer" class="answer" hidden></section>
  <div id="results"></div>
</main>
<script src="app.js"></script>
</body>
</html>
