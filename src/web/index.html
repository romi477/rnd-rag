<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs Search</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script>
  // The saved theme before the first paint, so a dark page does not flash light (app.js does the rest).
  try { const t = localStorage.getItem("rag.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main>
  <div class="chrome" id="chrome">
  <header class="top">
    <h1>Docs Search <span id="subtitle">· R&amp;D Products Documentation</span></h1>
    <!-- One switch, three positions, per tab: Search and Browse work on the documentation, Code explains a failed job from its traceback. -->
    <div class="view-switch" role="group" aria-label="View" title="Switch with F1 / F2 / F3, or step with Ctrl+Alt+Left / Right">
      <button type="button" id="pos-search" aria-pressed="true" title="Search the product documentation (F1)">Search</button>
      <button type="button" id="pos-browse" aria-pressed="false" title="All articles of the documentation (F2)">Browse</button>
      <button type="button" id="pos-code" aria-pressed="false" title="Explain a failed job from its traceback and the code of the modules (experimental) (F3)">Code</button>
    </div>
    <div class="tools">
      <button type="button" id="clear" class="icon-btn" title="Clear search" aria-label="Clear search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>
        </svg>
      </button>
      <button type="button" id="debug" class="icon-btn" title="Debug: show how each result was scored" aria-label="Debug mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>
        </svg>
      </button>
      <button type="button" id="theme" class="icon-btn" title="Switch theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Searches"></nav>
  <form id="form">
    <div class="q-row">
      <input id="q" type="search" maxlength="500" placeholder="Ask about connectors, Direct Print, labels…  (press / to focus)" autocomplete="off" autofocus>
      <!-- Code mode: the traceback is optional, a described problem is enough. The button opens the panel below. -->
      <button type="button" id="trace-add" class="secondary code-only" title="Add the traceback of a failed job (queue.job exc_info)" aria-label="Add traceback">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Add traceback</span>
      </button>
    </div>
    <div class="actions search-only">
      <button type="button" id="stop" class="secondary" hidden>Stop</button>
      <!-- Never disabled: an Enter pressed right after typing must still submit; run() ignores an empty query. -->
      <button type="submit" id="submit">Find</button>
    </div>
    <!-- The traceback of the tab: a small window that collapses to its title bar (state: tab.tracePanel). -->
    <section id="trace-panel" class="trace-panel code-only" aria-label="Traceback" hidden>
      <header class="trace-bar">
        <span class="trace-title">Traceback</span>
        <span id="trace-meta" class="trace-meta"></span>
        <button type="button" id="trace-toggle" class="icon-btn" aria-expanded="true" aria-controls="trace-body" title="Collapse" aria-label="Collapse the traceback">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button type="button" id="trace-remove" class="icon-btn" title="Remove the traceback" aria-label="Remove the traceback">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="trace-body" class="trace-body">
        <textarea id="trace" rows="7" maxlength="30000" spellcheck="false" aria-label="Traceback text"
          placeholder="Paste the traceback of a failed job (queue.job exc_info)"></textarea>
      </div>
    </section>
    <div class="filters">
      <label class="docs-only" title="Search only the pages of one product (a top-level section of the documentation).">Product <select id="product"><option value="">All</option></select></label>
      <label class="code-only" title="Search the code only in one module. A function named in the question is also looked up in the modules this one depends on; frames of the traceback are always looked up.">Module <select id="code-module"><option value="">All</option></select></label>
      <label class="code-only" title="Module version on the client's server: a different version from the indexed one is flagged, as line numbers may not match.">Client version <input id="client-version" type="text" size="10" maxlength="50" placeholder="19.0.2.3.0" autocomplete="off"></label>
      <label class="code-only" title="Also quote the Confluence pages that match the error message."><input type="checkbox" id="code-docs"> Add documentation</label>
      <span class="browse-only fold-group">
        <span id="browse-count"></span>
        <button type="button" id="fold-all" class="icon-btn" aria-label="Expand all groups"></button>
      </span>
      <!-- Browse: the Preview button of each article translates it with AI while this is on. -->
      <span class="llm-group browse-only">
        <label id="translate-label" title="Translate an article into another language with AI: the Preview button then shows the translation. The article text is sent to the Claude API."><input type="checkbox" id="translate"> AI translate</label>
        <select id="tlang" aria-label="Translate into" title="The language of the translation (turn on AI translate to change it). Menu paths, settings and code stay as they are."></select>
        <select id="tmodel" class="debug-only" aria-label="Translation model" title="The Claude model that translates (turn on AI translate to change it). Default: RAG_TRANSLATE_MODEL on the server."><option value="">Default</option></select>
      </span>
      <span class="llm-group search-only">
        <label id="llm-label" title="Also write an answer with AI from the top pages (local LM Studio or the Claude API, set on the server), citing them as [n]. Check the answer against the cited sources."><input type="checkbox" id="llm"> <span id="llm-text">AI answer</span></label>
        <select id="model" class="debug-only" aria-label="LLM model" title="The LLM that writes the answer (turn on AI answer to change it). Default: the model set on the server (in LM Studio: the loaded one). Models marked (not loaded) are loaded by LM Studio on first use, which takes a while."><option value="">Default</option></select>
        <select id="lang" aria-label="Answer language" title="The language of the LLM answer (turn on AI answer to change it). The sources stay in English; menu paths, settings and code are quoted as they are."><option value="en">English</option></select>
        <button type="button" id="refresh-models" class="icon-btn debug-only" title="Refresh the model list (and, with LM Studio, which models are loaded)" aria-label="Refresh the model list">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
          </svg>
        </button>
      </span>
    </div>
  </form>
  </div>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div id="status"></div>
  <section id="answer" class="answer" hidden></section>
  <div id="results"></div>
  <div id="browse"></div>
</main>
<!-- Browse: the article of a row, fetched when its Preview button is pressed; the page behind it is blurred. -->
<dialog id="preview" class="preview" aria-labelledby="preview-title">
  <header class="preview-bar">
    <div class="preview-heading">
      <div id="preview-crumbs" class="crumbs"></div>
      <h2 id="preview-title"></h2>
      <div id="preview-meta" class="meta"></div>
    </div>
    <a id="preview-open" class="preview-open" target="_blank" rel="noopener" title="Open the original article in Confluence" hidden>Open in Confluence ↗</a>
    <button type="button" id="preview-close" class="icon-btn" title="Close (Esc)" aria-label="Close the preview">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div id="preview-body" class="preview-body article" tabindex="-1"></div>
  <!-- Debug mode, after an AI translation: the model, its tokens and time. -->
  <footer id="preview-foot" class="preview-foot debug" hidden></footer>
</dialog>
<script src="app.js"></script>
</body>
</html>
